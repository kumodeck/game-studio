<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0f2f3a" />
  <title>Bubble Pop — PixiJS example</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0f2f3a; overflow: hidden; touch-action: none; }
    canvas { display: block; }
  </style>
  <!-- PixiJS 8.21.0 as an ES module from a CDN, pinned via the import map. No build step. -->
  <script type="importmap">
    { "imports": { "pixi.js": "https://cdn.jsdelivr.net/npm/pixi.js@8.21.0/dist/pixi.min.mjs" } }
  </script>
</head>
<body>
  <script type="module" src="game.js"></script>
</body>
</html>
