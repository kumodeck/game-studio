<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#1d2340" />
  <title>Glow Garden — three.js + HTML UI example</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1d2340; touch-action: none; font-family: system-ui, -apple-system, sans-serif; }
    canvas { display: block; }
    /* The HUD: always on screen. */
    .score { position: fixed; left: 20px; top: 16px; padding: 8px 14px; border-radius: 12px; background: rgba(10, 14, 32, 0.45);
      color: #fff6d8; font: 600 16px/1.2 system-ui, sans-serif; letter-spacing: 0.02em; pointer-events: none; }
    .score b { font-variant-numeric: tabular-nums; }
    /* The title card, centred the common way: left/top 50 % and a transform. The editor's UI layer moves it with the
       CSS translate / scale properties, so this transform is never touched. */
    .title-card { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%); text-align: center; color: #fff6d8;
      pointer-events: none; text-shadow: 0 2px 18px rgba(255, 190, 90, 0.55); }
    .title-card h1 { margin: 0; font: 700 clamp(36px, 8vw, 72px)/1 ui-serif, Georgia, serif; letter-spacing: 0.04em; }
    .title-card p { margin: 10px 0 0; font: 500 16px/1.3 system-ui, sans-serif; opacity: 0.8; }
    .start { position: fixed; left: 50%; bottom: 18%; translate: -50% 0; padding: 14px 34px; border: 0; border-radius: 999px;
      background: #ffcf6e; color: #2a1d05; font: 700 18px/1 system-ui, sans-serif; cursor: pointer; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      animation: glow 1.6s ease-in-out infinite alternate; }
    @keyframes glow { from { box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35); } to { box-shadow: 0 8px 34px rgba(255, 207, 110, 0.65); } }
    .playing .title-card, .playing .start { display: none; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.min.js"
      }
    }
  </script>
</head>
<body>
  <!-- data-studio-key: the UI the editor's UI layer can move (one key per element, on the box that moves). -->
  <div class="score" data-studio-key="score">Glow <b id="score">0</b> / 5</div>
  <div class="title-card" data-studio-key="title-card">
    <h1>Glow Garden</h1>
    <p>Tap the lanterns to light the garden</p>
  </div>
  <button class="start" type="button" data-studio-key="start-button">Start</button>
  <script type="module" src="game.js"></script>
</body>
</html>
