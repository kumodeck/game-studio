<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Hand Post</title>
  <!--
    pause-light (2026-10-28): a game whose look is a post-processing made by hand, which the editor cannot find by itself
    (no EffectComposer): each frame the scene is drawn into a render target, then that picture is drawn over the whole
    screen with a warm red tint (green and blue at a fifth). So a plain draw of the scene (no tint) is told apart from
    the game's own at a glance: the paused moment must stay red.
      crate, post  placed things (moved by the test)
      spinner      a thing the game turns every frame (its angle must not move while paused: no update for a picture)
      ground       a flat ground
    codeMoment({ draw }) is the one line the AI writes (SKILL.md "This moment"): the frame's drawing, without its update.
    window.__fx counts the updates and the draws, and gives the camera (tests only).
  -->
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; touch-action: none; }
    canvas { display: block; }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.min.js" } }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { applyPlacement, codeMoment } from './studio-placement.js';

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(1);
    document.body.prepend(renderer.domElement);
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x8fb4d8);
    const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 200);
    camera.position.set(0, 4, 11);
    camera.lookAt(0, 0.8, 0);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.2));
    const sun = new THREE.DirectionalLight(0xffffff, 1.6);
    sun.position.set(4, 8, 5);
    scene.add(sun);
    const mesh = (name, geo, color, x, y, z) => {
      const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color }));
      m.name = name;
      m.position.set(x, y, z);
      scene.add(m);
      return m;
    };
    mesh('ground', new THREE.BoxGeometry(30, 0.2, 30), 0x6f9a5a, 0, -0.1, 0);
    mesh('crate', new THREE.BoxGeometry(1.2, 1.2, 1.2), 0x40c0ff, -2.4, 0.6, 0);
    mesh('post', new THREE.CylinderGeometry(0.25, 0.25, 2.4, 16), 0xf2f2f2, 2.6, 1.2, -1);
    const spinner = mesh('spinner', new THREE.TorusGeometry(0.7, 0.18, 12, 32), 0x30d080, 0, 1.6, -2);

    // The hand-made post-processing: the scene into a target, then a full-screen quad of it, tinted.
    const rt = new THREE.WebGLRenderTarget(1, 1);
    const post = new THREE.Scene();
    const postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
      uniforms: { tDiffuse: { value: rt.texture } },
      vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }',
      // The target holds linear light: brought to the screen's sRGB by hand (pow 1/2.2), then green and blue at a fifth.
      fragmentShader: 'uniform sampler2D tDiffuse; varying vec2 vUv; void main(){ vec3 c = pow(max(texture2D(tDiffuse, vUv).rgb, 0.), vec3(1. / 2.2)); gl_FragColor = vec4(c.r, c.g * 0.2, c.b * 0.2, 1.); }',
      depthTest: false, depthWrite: false,
    }));
    post.add(quad);
    function resize() {
      renderer.setSize(innerWidth, innerHeight);
      rt.setSize(innerWidth, innerHeight);
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
    }
    addEventListener('resize', resize);
    resize();

    const fx = (window.__fx = { updates: 0, draws: 0, camera, spinner });
    /** The frame's drawing, without its update: what the paused moment is drawn with (codeMoment draw). */
    function drawFrame() {
      fx.draws++;
      renderer.setRenderTarget(rt);
      renderer.render(scene, camera);
      renderer.setRenderTarget(null);
      renderer.render(post, postCam);
    }
    codeMoment({ draw: drawFrame });
    await applyPlacement(scene, './placement.json').catch(() => null);

    const clock = new THREE.Timer();
    renderer.setAnimationLoop(() => {
      clock.update();
      const dt = Math.min(clock.getDelta(), 1 / 20);
      fx.updates++;
      spinner.rotation.y += dt * 1.5;
      // The camera sways a little (as the cove's does): a moment's draw must give it back exactly.
      camera.position.x = Math.sin(spinner.rotation.y * 0.3) * 0.4;
      camera.lookAt(0, 0.8, 0);
      drawFrame();
    });
  </script>
</body>
</html>
