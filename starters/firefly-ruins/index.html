<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#16263d" />
  <title>Firefly Ruins</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #16263d; touch-action: none; }
    canvas { display: block; }
    .title { position: fixed; left: 20px; top: 16px; font: 600 15px/1.2 ui-serif, Georgia, serif; letter-spacing: 0.18em;
      text-transform: uppercase; color: rgba(255, 236, 210, 0.75); text-shadow: 0 1px 8px rgba(10, 14, 28, 0.6); pointer-events: none; }
    .hint { position: fixed; left: 50%; bottom: max(28px, env(safe-area-inset-bottom)); transform: translateX(-50%);
      padding: 10px 18px; border-radius: 999px; background: rgba(10, 16, 28, 0.45); backdrop-filter: blur(6px);
      font: 500 15px/1.3 system-ui, -apple-system, sans-serif; color: #fff1dc; white-space: nowrap; pointer-events: none;
      transition: opacity 0.8s ease; }
    .hint small { opacity: 0.7; font-weight: 400; margin-left: 8px; }
    .hint.gone { opacity: 0; }
  </style>
  <script type="importmap">
    { "imports": { "pixi.js": "https://cdn.jsdelivr.net/npm/pixi.js@8.21.0/dist/pixi.min.mjs" } }
  </script>
</head>
<body>
  <div class="title">Firefly Ruins</div>
  <div class="hint" id="hint">Tap or click to send a breeze<small>Ring the bell, too</small></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
