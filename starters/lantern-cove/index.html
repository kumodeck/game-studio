<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#5a4a5e" />
  <title>Lantern Cove</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #6b5866; touch-action: none; }
    canvas { display: block; }
    .title { position: fixed; left: 20px; top: 16px; font: 600 15px/1.2 ui-serif, Georgia, serif; letter-spacing: 0.18em;
      text-transform: uppercase; color: rgba(255, 244, 230, 0.78); text-shadow: 0 1px 8px rgba(40, 20, 30, 0.45); pointer-events: none; }
    .hint { position: fixed; left: 50%; bottom: max(28px, env(safe-area-inset-bottom)); transform: translateX(-50%);
      padding: 10px 18px; border-radius: 999px; background: rgba(30, 22, 34, 0.42); backdrop-filter: blur(6px);
      font: 500 15px/1.3 system-ui, -apple-system, sans-serif; color: #fff4e6; white-space: nowrap; pointer-events: none;
      transition: opacity 0.8s ease; }
    .hint small { opacity: 0.7; font-weight: 400; margin-left: 8px; }
    .hint.gone { opacity: 0; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.min.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="title">Lantern Cove</div>
  <div class="hint" id="hint">Tap or click the water to sail<small>WASD works too</small></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
